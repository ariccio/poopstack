id: no-as-any
language: TypeScript
severity: error
message: "`as any` escapes the type system entirely — use a proper type, a validating constructor, or fix the underlying type"
note: >-
  Type honesty (.claude/rules/error-handling.md): `as any` leaves the type system entirely.
files:
  - "plugins/**/*.ts"
rule:
  pattern: $EXPR as any
